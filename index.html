<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador de botes</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c3a">
<style>
:root{--bg:#eaf2ec;--card:#fff;--tx:#12261a;--mu:#5f7566;--ac:#ff7a1a;--ac2:#ffb03a;--tb:#0f5c3a;--tb2:#16824f;--ok:#1f9d55;--bd:#d3e2d8;--sh:0 8px 24px rgba(15,60,38,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1710;--card:#14281c;--tx:#eaf4ec;--mu:#8fb09a;--ac:#ff8f3d;--tb:#0b4a2f;--tb2:#10653f;--ok:#3ecf7a;--bd:#24402f;--sh:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1710;--card:#14281c;--tx:#eaf4ec;--mu:#8fb09a;--ac:#ff8f3d;--tb:#0b4a2f;--tb2:#10653f;--ok:#3ecf7a;--bd:#24402f;--sh:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 26px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,var(--tb),var(--tb2));box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.35)}
.hero::after{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.3);border-radius:14px;pointer-events:none}
.hero h1{position:relative;margin:0;font-size:1.9rem;letter-spacing:-.5px;font-weight:900}
.hero p{position:relative;margin:4px 0 0;opacity:.85;font-size:.95rem}
.ball{position:absolute;right:26px;top:22px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd7b0 35%,var(--ac) 80%);box-shadow:0 8px 6px -4px rgba(0,0,0,.35);animation:bt 1s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes bt{from{transform:translateY(0)}to{transform:translateY(34px)}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:0 0 8px;font-weight:800}
.ghost,.pick button,.ord button,.seg button{font-family:inherit;color:var(--tx);cursor:pointer}
.ghost{padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:transparent;font-size:.95rem;font-weight:700}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px;max-height:230px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 4px 2px 2px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.pick button{padding:10px 0;border-radius:12px;border:2px solid var(--bd);background:transparent;font-size:1.05rem;font-weight:700}
.pick button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{padding:14px 4px;border-radius:12px;border:2px solid var(--bd);background:transparent;font-size:.9rem;font-weight:700}
.ord button.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.seg{display:flex;gap:6px;margin:16px 0 10px;padding:5px;border-radius:16px;background:var(--bg)}
.seg button{flex:1;padding:13px;border-radius:12px;border:0;background:transparent;font-size:1rem;font-weight:800;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.big{width:100%;padding:17px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;box-shadow:0 8px 18px -6px var(--ac);transition:transform .1s}
.big:active{transform:scale(.97)}
.cnt{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px}
.n{position:relative;aspect-ratio:1;border-radius:20px;border:0;font-family:inherit;font-size:2.2rem;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--tb2),var(--tb));box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .12s}
.n:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.n.done{background:var(--bd);color:var(--mu);box-shadow:none;transform:scale(.92)}
.n.done::after{content:"✓";position:absolute;top:6px;right:10px;font-size:1rem;color:var(--ok)}
.n.cur{background:linear-gradient(145deg,var(--ac),var(--ac2));animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 7px rgba(255,122,26,.25),0 6px 0 rgba(0,0,0,.22)}}
.n.lock{cursor:default}
.target{text-align:center;padding:4px 0 18px}
.target .v{font-size:7rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.target .t{color:var(--mu);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 14px;gap:8px;flex-wrap:wrap}
.prog{height:10px;flex:1;border-radius:9px;background:var(--bd);overflow:hidden;margin-right:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--ac2));transition:width .3s}
.win{text-align:center;font-size:1.7rem;font-weight:900;color:var(--ok);padding:14px 0 18px}
.nm{width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:700}
.pc.active{box-shadow:0 0 0 3px var(--ac),var(--sh)}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:1.15rem;margin-bottom:12px}
.badge{font-size:.72rem;background:var(--ac);color:#fff;padding:3px 10px;border-radius:20px}
.two .target .v{font-size:4.5rem}
.two .grid{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:9px}
.two .n{font-size:1.7rem}
.stp{display:flex;align-items:center;justify-content:center;gap:18px}
.stp span{font-size:1.8rem;font-weight:900;min-width:40px;text-align:center}
.pc.off{opacity:.5;pointer-events:none}
.hero{display:flex;align-items:center;gap:14px;min-height:150px;background:linear-gradient(90deg,rgba(5,38,24,.85) 0%,rgba(5,38,24,.45) 55%,rgba(5,38,24,0) 100%),url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAGMBLADASIAAhEBAxEB/8QAHAABAQABBQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAPxABAAEDAQMKAwgCAgAHAAMAAAECAxEEBSExBgcSEzdBcXSBsgihwRQiMlFhkbHhQtEjUiczQ1NicoI0kqL/xAAbAQEBAAMBAQEAAAAAAAAAAAAAAQMEBQIGB//EACsRAQACAgECBQQCAwEBAAAAAAABAgMRBCExBRI0QoEGIjJBUWETkbFxof/aAAwDAQACEQMRAD8A+nkBXgAFAAAAABAAUAAAAAAAAAAAAAAAAAAYX7kWrFy5PCimav2hm4zlJd6rY2oxxriKI9ZJebTqJl0TM1TMzxnfIgwue8756tV1extn6WJ33tRNcx+lNP8Aup5C7/zz6rreUOj00TusafpT41VTP8RDoCOdmnd5EUGJBQBJVJBFRRVEBFQJABA0ygQBkgAAAAAAAAAAAIoAAAQAKgAJPFQH1V8PHZnpfM3/AHtxz59n2o8xZ9zb/Dx2ZaXzN/3tzz6dn2o8zZ9zL7Xbt6X4fN0BCsD5lBUABQRQARSeAIZAAUAAEABQAAABFABFEABQAEwKCJghYMAKhkUAAei81Wo6Wj1+mmfwXKbkR+kxif4edO3c2Wo6rb92zM7r1iY9aZif9rDY41tZIepGZjfHGAenZelaa71+mtXY4V0RV+8NVxfJq71uxtP+dGaP2lybN+nQrO42AKoAigACiCAAqoAAAAAKgAqACoAAAAAAAACgAgAoIAIACgAAKIgAoKgAAAAAAAAAoCAAAAOu8s7uNLprX/euap8Ij+3YnTeWF3p7St24ndbtx+8zn/SW7MWadVcELhjcri1bquVTimiJqnP5RvYmi+fucPVfa+We1K4nNNFyLUeFMRH8xLr0NXV351Oqvaiqc1XblVyfWZn6tFHMt1na5MoDypCLAKigJgUBiKCiCgiiiJgUAAAAAAAAAAABAUAAAAAAAAAH1V8PHZnpfM3/AHtzz6dn2o8xZ9zb/Dx2Z6XzN/3txz69n2o8xZ9zL7Xbt6X4fNwQrA+ZEDO4NiiAoiAuTKKGyAUAAAAQAARQEFBQAJDCibRMCiiAAiigiggICgcRRUmHL8kdR9l5S7OuTOIm7FE+FUY+riZ4LauTZu0XKeNFUVx6Tke6T5bRL30Y2bkXrVFynfTXTFUesZZvbvR1ds5F3c6bU2Zn8NcVR6x/TsTpvI+70Np1287rluf3jf8A7dzZa9m7hndUFFZEFQUAAAAAAFAQFEQAUAAAAFAQAAVAAAEVAUAQAFAAAAFQAVAABQAQAAUQBRAQAAAFAUEUQRXn23LvXbX1Vecx0+jHpu+jv9yuLduuuZ3UxNU+jzOuqa66qp41TMz6vF2vyJ6RCOE5aav7FyU2rfziY09VNPjV92P5c26NzwarqOScWYnfqNRRR6Rmqf4h4aeSdVmXinDd+W4YqjmgKCKAAICqkAggd4oCgQqKIAAAACAKIoAAAAAAAAAIgoCgAAd4IPqv4eOzPS+Zv+9uOfXs+1HmLPubb4eezPS+Zv8Avbnn17P9R5mz7mb2u3b0vw+boO4JYHzKKAgCiphQBMABpRA function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e}
function hint(){$('hint').textContent=mode==='des'?'Pulsa el número en el marcador cuando lo consigáis; se marca.':'Se juega en orden: pulsa el botón cada vez que consigáis los botes que tocan.'}
function setMode(m){mode=m;$('mDes').classList.toggle('on',m==='des');$('mOrd').classList.toggle('on',m==='ord');hint()}
$('mDes').onclick=function(){setMode('des')};
$('mOrd').onclick=function(){setMode('ord')};
var nm=[];
function pname(k){return (nm[k]||'').trim()||('Jugador '+(k+1))}
function buildFirst(){
  var s=$('first'),v=s.value;s.innerHTML='';
  var o=el('option');o.value='r';o.textContent='🎲 Al azar';s.appendChild(o);
  for(var k=0;k<np;k++){var o2=el('option');o2.value=k;o2.textContent=pname(k);s.appendChild(o2)}
  if(v!==''&&(v==='r'||+v<np))s.value=v;else s.value='r';
}
function buildNames(){
  var box=$('names');box.innerHTML='';
  box.classList.toggle('hide',np<2);$('firstBox').classList.toggle('hide',np<2);
  for(var k=0;k<np&&np>1;k++){(function(k){
    var i=el('input','nm');i.type='text';i.maxLength=12;i.placeholder='Jugador '+(k+1);i.value=nm[k]||'';
    i.oninput=function(){nm[k]=i.value;buildFirst()};
    box.appendChild(i);
  })(k)}
  buildFirst();
}
function setNP(n){np=Math.max(1,Math.min(10,n));$('pn').textContent=np;buildNames()}
$('pm').onclick=function(){setNP(np-1)};
$('pp').onclick=function(){setNP(np+1)};
setNP(1);
hint();

var sel=[1,2,3,4,5,6],asc=true;
function parse(){return sel.slice().sort(function(a,b){return asc?a-b:b-a})}
function renderPick(){
  var p=$('pick');p.innerHTML='';
  for(var n=1;n<=20;n++){(function(n){
    var b=el('button');
    b.textContent=n;b.className=sel.indexOf(n)>=0?'on':'';
    b.onclick=function(){var k=sel.indexOf(n);if(k>=0)sel.splice(k,1);else sel.push(n);renderPick()};
    p.appendChild(b);
  })(n)}
  $('oAsc').classList.toggle('on',asc);$('oDesc').classList.toggle('on',!asc);
  $('tg').textContent='Números ('+sel.length+') '+($('pick').classList.contains('hide')?'▾':'▴');
}
$('oAsc').onclick=function(){asc=true;renderPick()};
$('oDesc').onclick=function(){asc=false;renderPick()};
$('tg').onclick=function(){$('pick').classList.toggle('hide');renderPick()};
renderPick();
$('start').onclick=function(){
  var n=parse();
  if(!n.length){$('hint').textContent='Elige al menos un número.';return}
  nums=n;begin();
};
function begin(){
  P=[];hist=[];turn=0;winner=-1;
  for(var k=0;k<np;k++){
    P.push({name:np>1?pname(k):'Jugador 1',done:nums.map(function(){return false})});
  }
  var f=$('first').value;turn=np<2?0:(f==='r'?Math.floor(Math.random()*np):+f);
  $('setup').classList.add('hide');$('game').classList.remove('hide');
  render();
}
function fail(i){
  if(winner>=0||i!==turn||np<2)return;
  hist.push([i,-1]);turn=(turn+1)%np;render();
}
function allDone(p){return p.done.every(Boolean)}
function curOf(p){return p.done.indexOf(false)}
function mark(i,j){
  if(winner>=0||i!==turn)return;
  var p=P[i];
  if(mode==='des')p.done[j]=!p.done[j];
  else{if(p.done[j])return;p.done[j]=true}
  hist.push([i,j]);
  if(winner<0&&allDone(p))winner=i;
  if(winner<0&&np>1)turn=(turn+1)%np;
  render();
}
$('undo').onclick=function(){
  if(!hist.length)return;
  var h=hist.pop();if(h[1]>=0)P[h[0]].done[h[1]]=!P[h[0]].done[h[1]];turn=h[0];
  if(winner>=0&&!allDone(P[winner]))winner=-1;
  render();
};
$('restart').onclick=function(){$('restart').classList.add('hide');$('rc').classList.remove('hide')};
$('rNo').onclick=function(){$('rc').classList.add('hide');$('restart').classList.remove('hide')};
$('rYes').onclick=function(){$('rc').classList.add('hide');$('restart').classList.remove('hide');begin()};
$('back').onclick=function(){$('game').classList.add('hide');$('setup').classList.remove('hide')};

function render(){
  var B=$('boards');B.innerHTML='';B.className=np>1?'two':'';
  var wb=$('winBox');wb.classList.toggle('hide',winner<0);
  wb.innerHTML='';
  if(winner>=0){var wi=el('img','wimg');wi.src=IMG.win;wi.alt='';wb.appendChild(wi);var wt=el('div');wt.textContent=np>1?'¡Gana '+P[winner].name+'!':'¡Partida completada!';wb.appendChild(wt)}
  P.forEach(function(p,i){
    var card=el('div','card pc'+(np>1&&turn===i&&winner<0?' active':'')+(np>1&&turn!==i&&winner<0?' off':''));
    if(np>1){
      var h=el('div','ph'),s=el('span');s.textContent=p.name;h.appendChild(s);
      if(turn===i&&winner<0){var b=el('span','badge');b.textContent='Su turno';h.appendChild(b)}
      card.appendChild(h);
    }
    var c=curOf(p);
    if(mode==='ord'&&c>=0){
      var t=el('div','target');
      t.innerHTML='<div class="t">Toca conseguir</div><div class="v">'+nums[c]+'</div><div class="t">botes<img class="bb" src="'+IMG.svg+'" alt=""></div>';
      card.appendChild(t);
    }
    var g=el('div','grid');
    nums.forEach(function(n,j){
      var b=el('button','n'+(p.done[j]?' done':'')+(mode==='ord'&&j===c?' cur':'')+(mode==='ord'?' lock':''));
      b.textContent=n;
      if(mode==='des')b.onclick=function(){mark(i,j)};
      g.appendChild(b);
    });
    card.appendChild(g);
    var d=p.done.filter(Boolean).length;
    var bar=el('div','bar');
    bar.innerHTML='<div class="prog"><i style="width:'+(100*d/nums.length)+'%"></i></div><span class="cnt">'+d+' / '+nums.length+'</span>';
    card.appendChild(bar);
    var act=np>1&&turn===i&&winner<0,isOrd=mode==='ord'&&c>=0;
    if(isOrd||act){
      var row=el('div','row');
      if(isOrd){var bt=el('button','big');bt.innerHTML='<img class="bi" src="'+IMG.ball+'" alt="">¡Conseguido!';bt.onclick=function(){mark(i,c)};row.appendChild(bt)}
      if(act){var fb=el('button','fail');fb.textContent='✖ Falló';fb.onclick=function(){fail(i)};row.appendChild(fb)}
      card.appendChild(row);
    }
    B.appendChild(card);
  });
  var a=B.querySelector('.active');
  if(a&&np>2)a.scrollIntoView({block:'center',behavior:'smooth'});
}
</script>
</body>
</html>
